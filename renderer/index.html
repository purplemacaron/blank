<!doctype html>
<html lang="ko" data-theme="light" data-font="noto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: blank-media:; media-src 'self' data: blob: blank-media:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; frame-src 'self' blank-paper: https: http:;" />
  <title>blank</title>
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/icon.png" />
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <style>html[data-i18n-pending] body { visibility: hidden; }</style>
  <script src="js/i18n.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="studio.css" />
</head>
<body>
  <div class="app-frame" id="app-frame">
    <header class="titlebar" id="titlebar">
      <div class="titlebar-left">
        <button class="titlebar-menu-btn" id="mobile-menu" type="button" aria-label="Open navigation">
          <span data-icon="layout"></span>
        </button>
        <div class="brand" data-action="home" title="blank">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#2F6BFF"/><path d="M8.6 4.4h4.6l4 4v9.2c0 .9-.7 1.6-1.6 1.6H8.6c-.9 0-1.6-.7-1.6-1.6V6c0-.9.7-1.6 1.6-1.6Z" fill="#fff"/><path d="M13.2 4.4v4h4Z" fill="#DCE7FF"/></svg>
          <span class="brand-word">blank</span>
        </div>
        <span class="titlebar-sep" aria-hidden="true"></span>
        <button class="workspace-chip" id="workspace-chip" type="button" title="Workspace">
          <span class="ws-icon" data-icon="folder"></span>
          <span class="ws-name" id="workspace-name">workspace</span>
          <span class="ws-caret" data-icon="chevron-down"></span>
        </button>
      </div>
      <div class="titlebar-center">
        <button class="palette-trigger" id="palette-trigger" type="button">
          <span data-icon="search"></span>
          <span>Search or jump to…</span>
          <kbd class="kbd" id="kbd-palette">Ctrl K</kbd>
        </button>
      </div>
      <div class="titlebar-right">
        <button class="pet-toggle" id="pet-toggle" type="button" title="Hide blank memo" aria-label="Hide blank memo" aria-pressed="true">
          <span data-icon="pet" data-size="15"></span>
        </button>
        <span class="runtime-pill" id="runtime-pill" title="Local runtime">
          <span class="pulse-dot" id="runtime-dot"></span>
          <span id="runtime-label">Local</span>
        </span>
        <div class="window-controls" id="window-controls" aria-label="Window controls">
          <button class="window-btn" data-win="minimize" type="button" title="Minimize" aria-label="Minimize">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
          </button>
          <button class="window-btn" data-win="maximize" type="button" title="Maximize" aria-label="Maximize">
            <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.4" y="2.4" width="7.2" height="7.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
          </button>
          <button class="window-btn close" data-win="close" type="button" title="Close" aria-label="Close">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.7 2.7l6.6 6.6M9.3 2.7L2.7 9.3" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar" aria-label="Sidebar">
        <div class="sidebar-top">
          <button class="new-session" id="new-session" type="button">
            <span data-icon="plus"></span>
            <span>New session</span>
            <kbd class="kbd new-kbd" id="kbd-new">Ctrl N</kbd>
          </button>
        </div>
        <div class="sidebar-scroll">
          <nav class="side-nav" id="side-nav" aria-label="Workspace">
            <button class="nav-item" data-page="chat" type="button">
              <span class="nav-icon" data-icon="message"></span><span class="nav-label">Chat</span>
            </button>
            <button class="nav-item" data-page="paper" type="button">
              <span class="nav-icon" data-icon="book"></span><span class="nav-label">Paper</span>
              <span class="nav-count" id="badge-paper"></span>
            </button>
            <button class="nav-item" data-page="code" type="button">
              <span class="nav-icon" data-icon="code"></span><span class="nav-label">Code</span>
            </button>
            <button class="nav-item" data-page="console" type="button">
              <span class="nav-icon" data-icon="terminal"></span><span class="nav-label">Console</span>
            </button>
            <button class="nav-item" data-page="team" type="button">
              <span class="nav-icon" data-icon="bot"></span><span class="nav-label">Team</span>
            </button>
            <button class="nav-item" data-page="automations" type="button">
              <span class="nav-icon" data-icon="clock"></span><span class="nav-label">Automations</span>
            </button>
            <button class="nav-item" data-page="models" type="button">
              <span class="nav-icon" data-icon="sparkles"></span><span class="nav-label">Models</span>
              <span class="nav-badge" id="badge-models" hidden></span>
            </button>
            <button class="nav-item" data-page="skills" type="button">
              <span class="nav-icon" data-icon="layers"></span><span class="nav-label">Skills</span>
              <span class="nav-count" id="badge-skills"></span>
            </button>
            <button class="nav-item" data-page="memory" type="button">
              <span class="nav-icon" data-icon="brain"></span><span class="nav-label">Memory</span>
              <span class="nav-count" id="badge-memory"></span>
            </button>
            <button class="nav-item" data-page="mcp" type="button">
              <span class="nav-icon" data-icon="plug"></span><span class="nav-label">MCP</span>
              <span class="nav-count" id="badge-mcp"></span>
            </button>
            <button class="nav-item" data-page="plugins" type="button">
              <span class="nav-icon" data-icon="link"></span><span class="nav-label">APIs</span>
            </button>
            <button class="nav-item" data-page="learning" type="button">
              <span class="nav-icon" data-icon="zap"></span><span class="nav-label">Learning</span>
              <span class="nav-badge accent" id="badge-learning" hidden></span>
            </button>
          </nav>

          <div class="sessions-block" id="sessions-block">
            <div class="side-label-row">
              <span class="side-label">Sessions</span>
              <button class="mini-icon" id="session-filter-btn" type="button" title="Filter sessions">
                <span data-icon="search"></span>
              </button>
            </div>
            <div class="session-search" id="session-search-wrap" hidden>
              <span data-icon="search"></span>
              <input type="text" id="session-search" placeholder="Filter sessions" spellcheck="false" />
              <button class="mini-icon" id="session-search-clear" type="button" title="Clear"><span data-icon="x"></span></button>
            </div>
            <div class="session-list" id="session-list"></div>
            <button class="archive-toggle" id="archive-toggle" type="button" hidden>
              <span data-icon="inbox"></span><span id="archive-label">Archived</span>
            </button>
          </div>
        </div>
        <div class="sidebar-footer">
          <button class="model-mini" id="sidebar-model" type="button" title="Default model">
            <span class="provider-mono" id="sidebar-model-mono">B</span>
            <span class="model-mini-copy">
              <span class="model-mini-name" id="sidebar-model-name">Choose a model</span>
              <span class="model-mini-label" id="sidebar-model-label">Connect a provider</span>
            </span>
            <span class="ws-caret" data-icon="chevron-updown"></span>
          </button>
          <button class="nav-item footer-item" data-page="settings" type="button">
            <span class="nav-icon" data-icon="settings"></span><span class="nav-label">Settings</span>
            <span class="nav-count" id="badge-updates" hidden></span>
          </button>
          <div class="sidebar-footnote">
            <span id="sidebar-version">blank</span>
          </div>
        </div>
      </aside>

      <main class="main" id="main">
        <section class="view view-chat" id="chat-view" aria-label="Chat"></section>
        <section class="view view-page" id="page-view" aria-label="Page" hidden></section>
      </main>

      <aside class="rail" id="rail" aria-label="Session context">
        <div class="rail-head">
          <div class="rail-tabs" id="rail-tabs" role="tablist">
            <button class="rail-tab active" data-rail="plan" role="tab" type="button" title="Plan" aria-label="Plan"><span data-icon="checklist"></span><span class="rail-tab-label">Plan</span> <span class="tab-count" id="rail-plan-count">0</span></button>
            <button class="rail-tab" data-rail="agents" role="tab" type="button" title="Agents" aria-label="Agents"><span data-icon="bot"></span><span class="rail-tab-label">Agents</span> <span class="tab-count" id="rail-agents-count">0</span></button>
            <button class="rail-tab" data-rail="files" role="tab" type="button" title="Files" aria-label="Files"><span data-icon="folder"></span><span class="rail-tab-label">Files</span> <span class="tab-count" id="rail-files-count">0</span></button>
            <button class="rail-tab" data-rail="context" role="tab" type="button" title="Context" aria-label="Context"><span data-icon="layers"></span><span class="rail-tab-label">Context</span></button>
            <button class="rail-tab rail-tab-icon" data-rail="browser" role="tab" type="button" title="Browser" aria-label="Browser"><span data-icon="globe"></span></button>
            <button class="rail-tab rail-tab-icon" data-rail="terminal" role="tab" type="button" title="Terminal" aria-label="Terminal"><span data-icon="terminal"></span></button>
          </div>
          <button class="mini-icon rail-expand" id="rail-expand" type="button" title="Expand panel">
            <span data-icon="maximize"></span>
          </button>
          <button class="mini-icon rail-close" id="rail-close" type="button" title="Hide panel">
            <span data-icon="panel-right"></span>
          </button>
        </div>
        <div class="rail-body" id="rail-body"></div>
        <div class="rail-browser" id="rail-browser" hidden></div>
        <div class="rail-foot" id="rail-foot">
          <button class="rail-action" id="rail-open-editor" type="button"><span data-icon="code"></span> Open in VS Code</button>
          <button class="rail-action subtle" id="rail-open-folder" type="button"><span data-icon="folder"></span> Reveal</button>
        </div>
      </aside>
    </div>
  </div>

  <div class="mobile-scrim" id="mobile-scrim" hidden></div>
  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div class="boot-splash" id="boot-splash">
    <div class="boot-mark">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="17" fill="currentColor"/><path d="M23 13h13l12 12v23a4 4 0 0 1-4 4H23a4 4 0 0 1-4-4V17a4 4 0 0 1 4-4Z" fill="#fff"/><path d="M36 13v12h12Z" fill="#DCE7FF"/></svg>
    </div>
    <div class="boot-word">blank</div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/util.js"></script>
  <script src="js/composer-key.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/api.js"></script>
  <script src="js/logos.js"></script>
  <script src="js/components.js"></script>
  <script src="js/viewer3d.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
