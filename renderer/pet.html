<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self';" />
  <title>blank memo</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body data-state="idle" data-theme="light">
  <div class="pet-stage" id="stage">
    <div class="pet-bubble" id="bubble" role="status" aria-live="polite">
      <span class="bubble-dot" aria-hidden="true"></span>
      <span class="bubble-text" id="bubble-text"></span>
      <span class="bubble-typing" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>

    <form class="pet-compose" id="compose" hidden>
      <input id="compose-input" type="text" maxlength="2000" autocomplete="off" spellcheck="false" aria-label="Instruction for blank" />
      <button type="submit" id="compose-send" aria-label="Send instruction">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.6M8 3.6 4.2 7.4M8 3.6l3.8 3.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <div class="pet" id="pet" role="button" tabindex="-1" aria-label="blank memo desktop pet">
      <span class="pet-shadow" aria-hidden="true"></span>
      <div class="pet-body" aria-hidden="true">
        <div class="pet-sheet">
          <span class="pet-fold"></span>
          <span class="pet-eye left"></span>
          <span class="pet-eye right"></span>
        </div>
      </div>
    </div>

    <div class="pet-id" id="pet-id" aria-hidden="true">
      <span class="pet-id-main" id="pet-id-main"></span>
      <span class="pet-id-sub" id="pet-id-sub"></span>
    </div>

    <div class="pet-menu" id="menu" hidden>
      <button type="button" data-menu="open"><span data-menu-label="open">Open blank</span></button>
      <button type="button" data-menu="reset"><span data-menu-label="reset">Reset position</span></button>
      <span class="pet-menu-sep" aria-hidden="true"></span>
      <button type="button" data-menu="hide"><span data-menu-label="hide">Hide blank memo</span></button>
    </div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
