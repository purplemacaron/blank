name: Build installers

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: macos-15-intel
            target: macos-intel
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer
        run: npm run dist
      - name: Upload unsigned Windows installer
        id: windows-unsigned
        if: matrix.target == 'windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: blank-windows-unsigned
          path: dist/blank-Setup-*.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign Windows installer
        if: matrix.target == 'windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.windows-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '3600'
          output-artifact-directory: signed-windows
      - name: Rebuild Windows update metadata for the signed installer
        if: matrix.target == 'windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed-windows -Recurse -Filter 'blank-Setup-*.exe' | Select-Object -First 1
          if (-not $signed) { throw 'SignPath did not return a signed Windows installer.' }
          node scripts/finalize-windows-signing.js "$($signed.FullName)" dist
          $installer = Get-ChildItem dist -Filter 'blank-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The signed Windows installer is missing from dist.' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Windows signature is not valid: $($signature.Status)" }
          Write-Host "Signed by $($signature.SignerCertificate.Subject)"
      - name: Warn about an unsigned Windows build
        if: matrix.target == 'windows' && vars.SIGNPATH_PROJECT_SLUG == ''
        shell: pwsh
        run: Write-Host '::warning::Windows installer is unsigned. Configure the SignPath repository variables to enable signing.'
      - uses: actions/upload-artifact@v4
        with:
          name: blank-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/latest.yml
            dist/latest-linux.yml
            dist/*.exe.blockmap
          if-no-files-found: error
          retention-days: 5

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        run: |
          node -e "const v=require('./package.json').version;const tag=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(v!==tag){console.error('Tag v'+tag+' does not match package.json version '+v);process.exit(1)}console.log('Releasing blank v'+v)"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          draft: false
